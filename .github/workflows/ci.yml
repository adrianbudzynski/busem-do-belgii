name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RAILPACK_VERSION: 0.43.0
  BUILDKIT_IMAGE: moby/buildkit:v0.25.1

jobs:
  build:
    name: Build (Node 16)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Views were copied into dist
        run: test -f dist/views/layouts/main.handlebars

  e2e:
    # Builds the deployable image the same way the host would, starts it,
    # and runs the Playwright smoke tests against it.
    name: Playwright (${{ matrix.builder }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        builder: [dockerfile, railpack]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image with Dockerfile
        if: matrix.builder == 'dockerfile'
        run: docker build -t site:ci .

      - name: Install Railpack
        if: matrix.builder == 'railpack'
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="railpack-v${RAILPACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "v${RAILPACK_VERSION}" --repo railwayapp/railpack \
            -p "$asset" -p checksums.txt
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          tar -xzf "$asset" railpack
          sudo install -m 755 railpack /usr/local/bin/railpack
          railpack --version

      - name: Build image with Railpack
        if: matrix.builder == 'railpack'
        env:
          BUILDKIT_HOST: docker-container://buildkit
        run: |
          docker run --rm --privileged -d --name buildkit "$BUILDKIT_IMAGE"
          railpack build --name site:ci .

      - name: Start site
        run: |
          docker run -d --name site -e PORT=3000 -p 3000:3000 site:ci
          for i in $(seq 1 30); do
            curl -fs -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          docker logs site
          exit 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: e2e/.nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3000
        run: npx playwright test

      - name: Site logs
        if: failure()
        run: docker logs site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.builder }}
          path: e2e/playwright-report
          retention-days: 7
